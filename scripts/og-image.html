<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OG image source</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        background: linear-gradient(180deg, #0a3448 0%, #06283a 60%, #041c2c 100%);
        font-family: "Bricolage Grotesque", sans-serif;
        color: #fff;
      }
      .surface {
        position: absolute;
        left: 0;
        right: 0;
        top: 150px;
        height: 2px;
        background: rgba(165, 243, 252, 0.3);
      }
      .agent {
        position: absolute;
        left: 50%;
        top: 143px;
        width: 16px;
        height: 16px;
        margin-left: -8px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 0 0 7px rgba(255, 255, 255, 0.12), 0 0 48px 14px rgba(6, 182, 212, 0.6);
      }
      .logo {
        position: absolute;
        top: 56px;
        left: 80px;
        font-weight: 600;
        font-size: 28px;
        letter-spacing: -0.02em;
      }
      .content {
        position: absolute;
        left: 80px;
        right: 80px;
        bottom: 110px;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 76px;
        line-height: 1;
        letter-spacing: -0.03em;
        font-weight: 600;
        font-variation-settings: "opsz" 96;
      }
      .sub {
        margin-top: 24px;
        font-size: 28px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.6);
      }
      .url {
        position: absolute;
        right: 80px;
        bottom: 48px;
        font-size: 22px;
        color: rgba(255, 255, 255, 0.5);
      }
    </style>
  </head>
  <body>
    <div class="logo">Droplet Labs</div>
    <div class="surface"></div>
    <div class="agent"></div>
    <div class="content">
      <h1>The agent is the easy part.</h1>
      <div class="sub">Your AI platform. On your cloud. In weeks.</div>
    </div>
    <div class="url">dropletlabs.co</div>
  </body>
</html>
