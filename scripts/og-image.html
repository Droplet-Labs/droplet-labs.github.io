<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OG image source</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@700&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        background: linear-gradient(180deg, #041c2c 0%, #0d3448 60%, #164e63 100%);
        font-family: "Outfit", sans-serif;
        color: #fff;
      }
      .orb {
        position: absolute;
        right: -80px;
        top: -80px;
        width: 420px;
        height: 420px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(6, 182, 212, 0.35), transparent 70%);
      }
      .logo {
        position: absolute;
        top: 64px;
        left: 80px;
        font-weight: 700;
        font-size: 28px;
        letter-spacing: -0.02em;
      }
      .content {
        position: absolute;
        left: 80px;
        bottom: 120px;
        width: 1000px;
      }
      .eyebrow {
        font-family: "JetBrains Mono", monospace;
        font-size: 20px;
        letter-spacing: 0.2em;
        color: #22d3ee;
        margin-bottom: 24px;
      }
      h1 {
        margin: 0;
        font-size: 72px;
        line-height: 1.08;
        letter-spacing: -0.03em;
        font-weight: 700;
      }
      .url {
        position: absolute;
        right: 80px;
        bottom: 56px;
        font-size: 22px;
        color: rgba(255, 255, 255, 0.5);
      }
    </style>
  </head>
  <body>
    <div class="orb"></div>
    <div class="logo">DROPLET LABS.</div>
    <div class="content">
      <div class="eyebrow">// AI PLATFORM</div>
      <h1>Your AI platform.<br />On your cloud. In weeks.</h1>
    </div>
    <div class="url">dropletlabs.co</div>
  </body>
</html>
